<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Boccherini periodic table">
  <!-- App icon: a periodic-table "element" cell. 91 = number of quartets; B = Boccherini.
       Helvetica sans, matching the real-periodic-table convention and the sibling Haydn icon.
       SQUARE + OPAQUE on purpose so the apple-touch-icon isn't double-masked and iOS/Android supply the
       corner rounding. Single source of truth: edit here, then run scripts/make-icons.sh to rebuild PNGs. -->
  <rect width="512" height="512" fill="#CE93D8"/>
  <text x="46" y="132" font-family="Helvetica, Arial, sans-serif" font-size="84" font-weight="600"
        fill="#26122b" fill-opacity="0.72">91</text>
  <text x="256" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="300" font-weight="bold" fill="#26122b">B</text>
  <!-- Movement-count palette dots (purple->green). The 2-movement swatch (#CE93D8) is omitted
       because it equals the lilac tile; the remaining four read cleanly with no outline.
       Pitch 52 (wider gaps read as distinct swatches when scaled to home-screen size),
       centered under the B at the tile center (x=256). -->
  <g>
    <circle cx="178" cy="446" r="14" fill="#9C27B0"/>
    <circle cx="230" cy="446" r="14" fill="#B0BEC5"/>
    <circle cx="282" cy="446" r="14" fill="#81C784"/>
    <circle cx="334" cy="446" r="14" fill="#2E7D32"/>
  </g>
</svg>
