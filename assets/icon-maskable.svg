<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Boccherini periodic table">
  <!-- Maskable variant: same art, content scaled into the ~80% safe zone so Android's circle/squircle
       crop never clips the "91" or the B. Full-bleed lilac ground. Rebuild via scripts/make-icons.sh. -->
  <rect width="512" height="512" fill="#CE93D8"/>
  <g transform="translate(256,256) scale(0.78) translate(-256,-256)">
    <text x="46" y="132" font-family="Helvetica, Arial, sans-serif" font-size="84" font-weight="600"
          fill="#3a1d42" fill-opacity="0.72">91</text>
    <text x="270" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="300" font-weight="700" fill="#3a1d42">B</text>
    <g stroke="#3a1d42" stroke-opacity="0.30" stroke-width="2">
      <circle cx="176" cy="442" r="14" fill="#9C27B0"/>
      <circle cx="216" cy="442" r="14" fill="#CE93D8"/>
      <circle cx="256" cy="442" r="14" fill="#B0BEC5"/>
      <circle cx="296" cy="442" r="14" fill="#81C784"/>
      <circle cx="336" cy="442" r="14" fill="#2E7D32"/>
    </g>
  </g>
</svg>
