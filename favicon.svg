<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Periodic Table of Boccherini String Quartets">
  <!-- Periodic-table "element" tile: 91 quartets, symbol Bc. Pink (#E91E63) is the
       app's one accent that's identical in light and dark mode (minor-key color). -->
  <rect width="180" height="180" rx="34" fill="#E91E63"/>
  <text x="16" y="46" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#2d0a13" fill-opacity="0.75">91</text>
  <text x="90" y="130" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="86" fill="#2d0a13" text-anchor="middle">Bc</text>
</svg>
