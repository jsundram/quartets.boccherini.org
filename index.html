<!DOCTYPE html>
<html lang="en">
<!--
    DARK MODE TESTING:
    To test dark mode explicitly (regardless of system preference):
    1. Open browser console (F12)
    2. Run: document.documentElement.classList.add('dark-mode')
    3. To disable: document.documentElement.classList.remove('dark-mode')

    Dark mode automatically follows system preference via @media (prefers-color-scheme: dark)
    Dark mode also works for print/PDF output.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table of Boccherini String Quartets</title>
    <meta name="description" content="An interactive periodic table of all 91 of Boccherini's string quartets (1761–1804) — key, Gerard number, mode, and movement count, arranged by opus.">
    <meta name="color-scheme" content="light dark">

    <!-- Browser-UI tint, one per scheme (matches --bg-body light/dark). -->
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">

    <!-- Home-screen / install polish. iOS reads these + apple-touch-icon; Android reads the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Boccherini">
    <link rel="manifest" href="./manifest.json">

    <!-- Icons. Regenerate the PNGs from assets/icon.svg via scripts/make-icons.sh. -->
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
    <link rel="icon" type="image/png" href="./assets/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icon-180.png">

    <!-- Link previews. og:image is an absolute https URL to a 1200x630 raster (assets/og.png). -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Periodic Table of Boccherini String Quartets">
    <meta property="og:title" content="Periodic Table of Boccherini String Quartets">
    <meta property="og:description" content="An interactive periodic table of all 91 of Boccherini's string quartets (1761–1804) — key, Gerard number, mode, and movement count, arranged by opus.">
    <meta property="og:url" content="https://quartets.boccherini.org/">
    <meta property="og:image" content="https://quartets.boccherini.org/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Portrait of Boccherini's 91 string quartets as a periodic table, cells colored by opera grande / piccola with minor keys marked, split into early (Op. 2–33) and late (Op. 39–64) periods.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Periodic Table of Boccherini String Quartets">
    <meta name="twitter:description" content="An interactive periodic table of all 91 of Boccherini's string quartets (1761–1804).">
    <meta name="twitter:image" content="https://quartets.boccherini.org/assets/og.png">
    <link rel="canonical" href="https://quartets.boccherini.org/">

    <script src="d3.v7.min.js"></script>

    <!-- PWA boot: registers sw.js (offline shell) + a one-tap "update available" pill. Self-contained. -->
    <script defer src="app.js"></script>


    <style>
        :root {
            /* === DYNAMIC SIZING SYSTEM === */
            /* Scale Card Size based on browser window width */
            --card-height: clamp(100px, 12vw, 140px);
            --card-gap: clamp(6px, 0.8vw, 10px);
            --opus-label-width: clamp(85px, 8vw, 95px);
            --top-section-height: clamp(14px, 1.7vw, 20px);
            --nickname-height: clamp(10px, 1.3vw, 15px);
            --bottom-section-height: clamp(14px, 1.7vw, 20px);

            /* Movement lines configuration */
            --mvmt-line-height: 10px;  /* Height of each movement bar */
            --mvmt-line-width: 20px;   /* Width of each movement bar */
            --mvmt-line-spacing: 4px;  /* Gap between movement bars */
            --mvmt-bar-color: #444444;   /* Color for regular movement bars */
            --mvmt-bar-minuet: #EEEEEE;  /* Highlight color for minuet movements */
            --mvmt-bar-spotify: #1DB954;  /* Spotify green for hover when track exists */

            /* Calculated middle section height - same for both sides */
            --middle-section-height: calc(
                var(--card-height)
                - var(--top-section-height)
                - var(--nickname-height)
                - var(--bottom-section-height)
            );

            /* Font sizes for aligned elements */
            --top-font-size: 0.8em;
            --middle-font-size: 2.8em;
            --bottom-font-size: 0.7em;

            /* Header widths */
            --header-width: 900px;

            /* === DEBUG MODE === */
            --debug-mode: 0; /* Set to 1 to show bounding boxes, 0 to hide */

            /* === OWNERSHIP INDICATOR === */
            --show-ownership: 1; /* Set to 1 to show repeat signs on owned parts, 0 to hide */

            /* === COLOR SYSTEM (LIGHT MODE DEFAULT) === */
            /* Background colors */
            --bg-body: #f5f5f5;
            --bg-card: white;
            --bg-card-no-minuet: rgba(0, 0, 0, 0.03);
            --bg-tooltip: rgba(0, 0, 0, 0.9);
            --bg-mode-bar-major: transparent;
            --bg-mode-bar-minor: #E91E63;

            /* Text colors */
            --text-primary: #222;
            --text-secondary: #333;
            --text-tertiary: #444;
            --text-muted: #666;
            --text-light: #777;
            --text-lighter: #888;
            --text-lightest: #999;
            --text-link: #2196F3;
            --text-link-hover: #1976D2;
            --text-on-tooltip: white;

            /* Mode bar text colors */
            --text-gerard-major: #444;
            --text-quartet-major: #888;
            --text-gerard-minor: white;
            --text-quartet-minor: rgba(255, 255, 255, 0.85);

            /* Border colors */
            --border-card: #ddd;
            --border-card-hover: #888;
            --border-card-active: #333;

            /* Shadow colors */
            --shadow-card: rgba(0, 0, 0, 0.1);
            --shadow-card-hover: rgba(0, 0, 0, 0.2);

            /* Movement count colors (diverging palette) */
            --mvmt-1-bg: #9C27B0;
            --mvmt-1-text: white;
            --mvmt-2-bg: #CE93D8;
            --mvmt-2-text: #333;
            --mvmt-3-bg: #B0BEC5;
            --mvmt-3-text: #333;
            --mvmt-4-bg: #81C784;
            --mvmt-4-text: #333;
            --mvmt-5-bg: #2E7D32;
            --mvmt-5-text: white;

            /* Category badge colors */
            --badge-grande-bg: #81C784;
            --badge-grande-text: #333;
            --badge-piccola-bg: #CE93D8;
            --badge-piccola-text: #333;

            /* Opus label gradient backgrounds */
            --gradient-grande: rgba(129, 199, 132, 0.12);
            --gradient-piccola: rgba(206, 147, 216, 0.12);

            /* Missing data indicator backgrounds */
            /* preview here: https://color.adobe.com/boccherini-data-light-color-theme-64a52cd9-23c4-491c-af91-a4540f74fd3c/ */
            --bg-links-no-imslp: #e0e0e0;      /* Gray - IMSLP only missing */
            --bg-links-no-music: #bbdefb;      /* Light blue - music only missing */
            --bg-links-no-data: #90a4ae;       /* Blue-gray - both missing */
            --bg-links-peters: #A0DFD0;        /* Minty green - Peters edition available */
        }

        /* === DARK MODE COLORS === */
        @media (prefers-color-scheme: dark) {
            :root {
                /* Background colors */
                --bg-body: #1a1a1a;
                --bg-card: #2d2d2d;
                --bg-card-no-minuet: rgba(255, 255, 255, 0.03);
                --bg-tooltip: rgba(240, 240, 240, 0.95);
                --bg-mode-bar-major: transparent;
                --bg-mode-bar-minor: #E91E63;

                /* Text colors */
                --text-primary: #f0f0f0;
                --text-secondary: #e0e0e0;
                --text-tertiary: #d0d0d0;
                --text-muted: #b0b0b0;
                --text-light: #999;
                --text-lighter: #888;
                --text-lightest: #707070;
                --text-link: #64B5F6;
                --text-link-hover: #90CAF9;
                --text-on-tooltip: #222;

                /* Mode bar text colors */
                --text-gerard-major: #d0d0d0;
                --text-quartet-major: #999;
                --text-gerard-minor: white;
                --text-quartet-minor: rgba(255, 255, 255, 0.85);

                /* Border colors */
                --border-card: #555;
                --border-card-hover: #888;
                --border-card-active: #aaa;

                /* Shadow colors - more subtle in dark mode */
                --shadow-card: rgba(0, 0, 0, 0.3);
                --shadow-card-hover: rgba(0, 0, 0, 0.5);

                /* Movement count colors - same backgrounds, adjusted text for contrast */
                --mvmt-1-bg: #9C27B0;
                --mvmt-1-text: white;
                --mvmt-2-bg: #CE93D8;
                --mvmt-2-text: #1a1a1a;
                --mvmt-3-bg: #B0BEC5;
                --mvmt-3-text: #1a1a1a;
                --mvmt-4-bg: #81C784;
                --mvmt-4-text: #1a1a1a;
                --mvmt-5-bg: #2E7D32;
                --mvmt-5-text: white;

                /* Category badge colors - same backgrounds, adjusted text */
                --badge-grande-bg: #81C784;
                --badge-grande-text: #1a1a1a;
                --badge-piccola-bg: #CE93D8;
                --badge-piccola-text: #1a1a1a;

                /* Opus label gradient backgrounds - reduced opacity */
                --gradient-grande: rgba(129, 199, 132, 0.08);
                --gradient-piccola: rgba(206, 147, 216, 0.08);

                /* Missing data indicator backgrounds */
                /* preview here: https://color.adobe.com/boccherini-data-dark-color-theme-b46a805a-1154-41d7-a917-b99c9e2053ec/ */
                --bg-links-no-imslp: #6e6e6e;      /* Lighter gray - IMSLP only missing */
                --bg-links-no-music: #1565c0;      /* Darker blue - music only missing */
                --bg-links-no-data: #1e3a5f;       /* Deep navy - both missing */
                --bg-links-peters: #00796b;        /* Deep teal - Peters edition available */
            }
        }

        /* === EXPLICIT DARK MODE CLASS (FOR TESTING) === */
        /* Use: <html class="dark-mode"> or document.documentElement.classList.add('dark-mode') */
        .dark-mode {
            /* Background colors */
            --bg-body: #1a1a1a;
            --bg-card: #2d2d2d;
            --bg-card-no-minuet: rgba(255, 255, 255, 0.3);
            --bg-tooltip: rgba(240, 240, 240, 0.95);
            --bg-mode-bar-major: transparent;
            --bg-mode-bar-minor: #E91E63;

            /* Text colors */
            --text-primary: #f0f0f0;
            --text-secondary: #e0e0e0;
            --text-tertiary: #d0d0d0;
            --text-muted: #b0b0b0;
            --text-light: #999;
            --text-lighter: #888;
            --text-lightest: #707070;
            --text-link: #64B5F6;
            --text-link-hover: #90CAF9;
            --text-on-tooltip: #222;

            /* Mode bar text colors */
            --text-gerard-major: #d0d0d0;
            --text-quartet-major: #999;
            --text-gerard-minor: white;
            --text-quartet-minor: rgba(255, 255, 255, 0.85);

            /* Border colors */
            --border-card: #555;
            --border-card-hover: #888;
            --border-card-active: #aaa;

            /* Shadow colors */
            --shadow-card: rgba(0, 0, 0, 0.3);
            --shadow-card-hover: rgba(0, 0, 0, 0.5);

            /* Movement count colors */
            --mvmt-1-bg: #9C27B0;
            --mvmt-1-text: white;
            --mvmt-2-bg: #CE93D8;
            --mvmt-2-text: #1a1a1a;
            --mvmt-3-bg: #B0BEC5;
            --mvmt-3-text: #1a1a1a;
            --mvmt-4-bg: #81C784;
            --mvmt-4-text: #1a1a1a;
            --mvmt-5-bg: #2E7D32;
            --mvmt-5-text: white;

            /* Category badge colors */
            --badge-grande-bg: #81C784;
            --badge-grande-text: #1a1a1a;
            --badge-piccola-bg: #CE93D8;
            --badge-piccola-text: #1a1a1a;

            /* Opus label gradient backgrounds */
            --gradient-grande: rgba(129, 199, 132, 0.08);
            --gradient-piccola: rgba(206, 147, 216, 0.08);

            /* Missing data indicator backgrounds */
            --bg-links-no-imslp: #6e6e6e;      /* Lighter gray - IMSLP only missing */
            --bg-links-no-music: #1565c0;      /* Darker blue - music only missing */
            --bg-links-no-data: #1e3a5f;       /* Deep navy - both missing */
            --bg-links-peters: #00796b;        /* Deep teal - Peters edition available */
        }

        /* Debug bounding boxes - controlled by --debug-mode */
        .opus-label .year-age {
            outline: calc(var(--debug-mode) * 1px) solid rgba(255, 0, 0, 0.3);
        }

        .opus-label .opus-number {
            outline: calc(var(--debug-mode) * 1px) solid rgba(0, 255, 0, 0.3);
        }

        .opus-label .bottom-section {
            outline: calc(var(--debug-mode) * 1px) solid rgba(0, 0, 255, 0.3);
        }

        .mode-bar {
            outline: calc(var(--debug-mode) * 1px) solid rgba(255, 0, 0, 0.3);
        }

        .key-section {
            outline: calc(var(--debug-mode) * 1px) solid rgba(0, 255, 0, 0.3);
        }

        .movements-count {
            outline: calc(var(--debug-mode) * 1px) solid rgba(0, 0, 255, 0.3);
        }

        .nickname {
            outline: calc(var(--debug-mode) * 1px) solid rgba(255, 165, 0, 0.3);
        }

        .opus-label .dedication {
            outline: calc(var(--debug-mode) * 1px) solid rgba(128, 0, 128, 0.3);
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-body);
            margin: 20px;
            padding: 0;
        }

        .container {
            width: fit-content;         /* Shrink to visualization width */
            margin: 0 auto;             /* Center the container */
            display: flex;
            flex-direction: column;
            align-items: stretch;       /* Children match container width */
        }

        .header-group {
            /* Header spans full width of visualization */
            display: flex;
            flex-direction: column;
            align-items: stretch;       /* Children stretch to container width */
            container-type: inline-size; /* Enable container queries for children */
        }

        h1 {
            margin: 0 0 5px 0;          /* Small gap below */
            text-align: center;
            color: var(--text-secondary);
            font-size: 4.3cqw;          /* Scale to span container width */
            white-space: nowrap;        /* Keep on one line */
        }

        .subtitle {
            margin: 0 0 25px 0;         /* Larger gap below */
            text-align: right;          /* Right-align to match title's right edge */
            color: var(--text-muted);
            font-size: clamp(0.75em, 0.85vw, 0.9em);  /* Scales smoothly */
            font-style: italic;
        }

        .subtitle a {
            color: var(--text-link);
            text-decoration: none;
        }

        .subtitle a:hover {
            text-decoration: underline;
        }

        .opus-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        /* Combined rows - no special CSS needed, just flex layout */
        .opus-row.combined-pair {
            /* Flexbox will lay out multiple label+card groups horizontally */
        }

        /* === OPUS LABEL SECTION (easy to tweak) === */

        .opus-label {
            /* Container sizing - MATCHES CARD HEIGHT, scales proportionally */
            width: var(--opus-label-width);
            height: var(--card-height);
            padding: clamp(1px, 0.2vw, 2px) clamp(3px, 0.5vw, 6px) 0 clamp(5px, 0.8vw, 10px);

            /* Layout - vertical alignment structure */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;    /* Stack from top, no auto-spacing */
            text-align: right;
            position: relative;
        }

        /* Background gradient based on category - applied via JS */
        .opus-label.grande-bg {
            background: linear-gradient(to right,
                transparent 0%,
                var(--gradient-grande) 100%);  /* Light green fade */
        }

        .opus-label.piccola-bg {
            background: linear-gradient(to right,
                transparent 0%,
                var(--gradient-piccola) 100%);  /* Light purple fade */
        }

        /* TOP SECTION: Year and Age - ALIGNS WITH MODE BAR */
        .opus-label .year-age {
            display: flex;
            justify-content: space-between;  /* Year left, age right - periodic table aesthetic */
            align-items: center;
            height: var(--top-section-height);
            flex-shrink: 0;
            line-height: 1;                 /* Match mode-bar line-height */
        }

        .opus-label .year {
            font-size: var(--top-font-size);
            font-weight: 700;               /* Slightly bolder for clarity */
            color: var(--text-tertiary);    /* Slightly darker */
            line-height: 1;                 /* Exact alignment */
        }

        .opus-label .age {
            font-size: calc(var(--top-font-size) * 0.85);  /* Slightly larger */
            font-weight: 400;               /* Regular weight */
            color: var(--text-light);       /* Slightly darker */
            line-height: 1;                 /* Exact alignment */
        }

        /* MIDDLE SECTION: Opus number - ALIGNS WITH KEY/MODE */
        .opus-label .opus-number {
            font-size: var(--middle-font-size);
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1;
            letter-spacing: -0.03em;
            height: var(--middle-section-height);  /* Fixed height to match key-section */
            margin-bottom: var(--nickname-height); /* Spacer to match nickname section */
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        /* BOTTOM SECTION: Dedication and category badge */
        .opus-label .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;          /* Right align */
            justify-content: center;        /* Vertically center - matches movements-count */
            flex-shrink: 0;
            height: var(--bottom-section-height);  /* Fixed height to match movements-count */
            position: relative;             /* For dedication positioning */
        }

        /* Dedication - absolutely positioned above opus number to preserve alignment */
        .opus-label .dedication {
            position: absolute;             /* Remove from layout flow */
            top: calc(var(--top-section-height) + 2px);  /* Position below year/age */
            left: 0;
            right: 0;
            font-size: 0.6em;               /* Size: smallest */
            font-style: italic;             /* Style: italic */
            color: var(--text-lightest);    /* Color: lighter gray */
            text-align: center;             /* Center align */
            line-height: 1.2;               /* Tighter line height for wrapping */
            z-index: 1;                     /* Above background */
        }

        /* Category badge - aligns with movement count */
        .opus-label .category-badge {
            font-size: var(--bottom-font-size);  /* Aligns with movement count */
            width: 100%;                    /* Full width like movement count */
            height: 100%;                   /* Full height like movement count */
            display: flex;                  /* Use flexbox for centering */
            align-items: center;            /* Vertically center text */
            justify-content: center;        /* Horizontally center text */
            font-weight: 500;               /* Match movement count weight */
            line-height: 1;                 /* Match movement count */
        }

        /* === END OPUS LABEL SECTION === */

        .quartets-container {
            display: flex;
            flex-wrap: nowrap;
            gap: var(--card-gap);
            margin-left: var(--card-gap); /* Gap between label and cards */
        }

        /* Spacer between opus groups in combined rows */
        .opus-spacer {
            /* Responsive scaling for desktop/iPad; print/mobile override with calc() */
            width: clamp(120px, 15vw, 177px);
            height: var(--card-height);
            flex-shrink: 0;
            margin: 0 var(--card-gap);
        }

        .quartet-card {
            width: var(--card-height);      /* Square cards - width matches height */
            height: var(--card-height);
            background: var(--bg-card);
            border: 2px solid var(--border-card);
            border-radius: 4px;
            padding: 0;
            box-shadow: 2px 2px 5px var(--shadow-card);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .quartet-card:hover {
            transform: translateY(-3px);
            box-shadow: 3px 3px 10px var(--shadow-card-hover);
            border-color: var(--border-card-hover);
        }

        /* Subtle gray wash for quartets without minuets */
        .quartet-card.no-minuet {
            background: var(--bg-card-no-minuet);
        }

        .mode-bar {
            height: var(--top-section-height);  /* Aligns with year-age section */
            width: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            box-sizing: border-box;
        }

        .mode-bar.major {
            background: var(--bg-mode-bar-major);
        }

        .mode-bar.minor {
            background: var(--bg-mode-bar-minor);
        }

        .card-content {
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            /* No position: relative - nickname positions relative to .quartet-card instead */
        }

        /* Text colors for major keys (on transparent background) */
        .mode-bar.major .quartet-number {
            font-size: var(--top-font-size);   /* Aligns with year */
            color: var(--text-quartet-major);  /* Lighter gray */
            font-weight: 600;                  /* Semi-bold */
            line-height: 1;                    /* Exact alignment */
        }

        .mode-bar.major .gerard-number {
            font-size: var(--top-font-size);   /* Aligns with year */
            font-weight: 700;                  /* Bold for emphasis */
            color: var(--text-gerard-major);   /* Darker for readability */
            line-height: 1;                    /* Exact alignment */
        }

        /* Text colors for minor keys (on colored background) */
        .mode-bar.minor .quartet-number {
            font-size: var(--top-font-size);   /* Aligns with year */
            color: var(--text-quartet-minor);  /* Slightly less opaque */
            font-weight: 600;                  /* Semi-bold */
            line-height: 1;                    /* Exact alignment */
        }

        .mode-bar.minor .gerard-number {
            font-size: var(--top-font-size);   /* Aligns with year */
            font-weight: 700;                  /* Bold for emphasis */
            color: var(--text-gerard-minor);
            line-height: 1;                    /* Exact alignment */
        }

        /* Key section - aligns with opus number */
        .key-section {
            height: var(--middle-section-height);  /* Fixed height to match opus-number */
            margin-bottom: var(--nickname-height); /* Space for nickname below (matches opus-number margin-bottom) */
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;        /* Vertically center */
            align-items: center;            /* Horizontally center */
            padding: 0 8px;                 /* Horizontal padding only */
        }

        .key-signature {
            text-align: center;
            font-size: calc(var(--middle-font-size) * 0.64);  /* Proportional to opus number */
            font-weight: bold;
            color: var(--text-primary);
            line-height: 1;
            margin: 0;                     /* Remove margin for proper centering */
        }

        .key-mode {
            text-align: center;
            font-size: 0.75em;
            color: var(--text-muted);
            margin: 0;                     /* Remove margin for proper centering */
            line-height: 1;
            margin-top: 2px;               /* Small space above, not below key-signature */
        }

        /* Key signature accidentals - vertical bar on right side of card */
        .key-accidentals {
            position: absolute;
            left: 3px;
            top: var(--top-section-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Size to fit 4 glyphs comfortably in middle section */
            font-size: calc(var(--middle-section-height) / 5);
            line-height: 1.1;
            color: var(--text-lightest);
            opacity: 0.8;
            pointer-events: none;
        }

        .key-accidentals span {
            display: block;
        }

        .category-badge.grande {
            background-color: var(--badge-grande-bg);
            color: var(--badge-grande-text);
        }

        .category-badge.piccola {
            background-color: var(--badge-piccola-bg);
            color: var(--badge-piccola-text);
        }

        /* Links container for quartet cards - holds IMSLP, QR, and Recording indicator */
        .card-links {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;  /* 3 equal columns: IMSLP (left), QR (center), Recording (right) */
            align-items: center;
            padding: 2px 4px;
            font-size: 0.65em;
            font-weight: 400;
        }

        .imslp-link,
        .qr-link,
        .recording-indicator {
            color: var(--text-link);
            text-decoration: none;
        }

        .imslp-link {
            justify-self: start;  /* Left-aligned in its grid cell */
        }

        .qr-link {
            justify-self: center;  /* Center-aligned in its grid cell */
        }

        .recording-indicator {
            justify-self: end;  /* Right-aligned in its grid cell */
            line-height: 1;     /* Constrain height of musical note character */
        }

        a.recording-indicator {
            cursor: pointer;  /* Clickable when it's a link */
        }

        span.recording-indicator {
            cursor: default;  /* Not clickable when no track available */
        }

        .imslp-link:hover,
        .qr-link:hover,
        a.recording-indicator:hover {
            text-decoration: underline;
            color: var(--text-link-hover);
        }

        /* Missing data indicator backgrounds */
        .card-links.no-imslp {
            background-color: var(--bg-links-no-imslp);
        }

        .card-links.no-music {
            background-color: var(--bg-links-no-music);
        }

        .card-links.no-data {
            background-color: var(--bg-links-no-data);
        }

        .card-links.peters {
            background-color: var(--bg-links-peters);
        }

        /* IMSLP link in opus label - positioned absolutely to not affect layout */
        .opus-label .imslp-link {
            position: absolute;
            bottom: 100%;                  /* Position above bottom-section */
            left: 0;                       /* Left align to match quartet cells */
            margin-bottom: 1px;            /* Minimal space below link */
            padding: 2px 4px;              /* Match quartet cell link padding */
            font-size: 0.65em;             /* Match quartet cell link size */
            font-weight: 400;              /* Lighter weight */
        }

        .movements-count {
            text-align: center;
            font-size: var(--bottom-font-size);  /* Aligns with category badge */
            height: var(--bottom-section-height); /* Fixed height to match bottom-section */
            flex-shrink: 0;
            display: flex;
            align-items: center;           /* Vertically center text */
            justify-content: center;       /* Horizontally center text */
            margin: 0;
            padding: 0 0px;                /* Small padding for repeat glyphs */
            border-radius: 0;              /* Square edges like top bar */
            font-weight: 500;
            line-height: 1;                /* Match category badge */
        }

        /* Repeat glyphs for parts.json quartets */
        .movements-count .repeat-start,
        .movements-count .repeat-end {
            font-size: 1.75em;  /* Make glyphs taller */
            line-height: 1;
            opacity: var(--show-ownership);  /* Controlled by CSS variable */
        }

        .movements-count .repeat-start {
            margin-right: auto;
        }

        .movements-count .repeat-end {
            margin-left: auto;
        }

        /* SVG movement lines - centered within movements-count */
        .movements-count .mvmt-lines-svg {
            display: block;
            height: var(--mvmt-line-height);
        }

        /* Diverging color scheme: Purple (short) -> Gray (standard) -> Green (long) */
        .movements-count.mvmt-1 {
            background-color: var(--mvmt-1-bg);
            color: var(--mvmt-1-text);
        }

        .movements-count.mvmt-2 {
            background-color: var(--mvmt-2-bg);
            color: var(--mvmt-2-text);
        }

        .movements-count.mvmt-3 {
            background-color: var(--mvmt-3-bg);
            color: var(--mvmt-3-text);
        }

        .movements-count.mvmt-4 {
            background-color: var(--mvmt-4-bg);
            color: var(--mvmt-4-text);
        }

        .movements-count.mvmt-5 {
            background-color: var(--mvmt-5-bg);
            color: var(--mvmt-5-text);
        }

        .nickname {
            position: absolute;              /* Remove from layout flow to preserve alignment */
            top: calc(var(--top-section-height) + 2px);  /* Match dedication positioning */
            left: 0;
            right: 0;
            max-height: 15px;                /* Constrain to allocated space (22px to 35px) */
            overflow: hidden;                /* Clip overflow to prevent overlapping key section */
            font-size: 0.75em;               /* Readable size; longest nickname still fits smallest card */
            font-style: italic;              /* Same as dedication */
            color: var(--text-lightest);     /* Same as dedication */
            text-align: center;              /* Center align */
            line-height: 1;                  /* Tight line-height to maximize space */
            z-index: 2;                      /* Above mode bar */
            pointer-events: none;            /* Don't block clicks on mode bar */
        }

        .tooltip {
            position: absolute;
            /* Anchor at 0,0 until shown (JS sets left/top inline). With auto
               offsets the hidden tooltip would sit at its static position —
               BELOW the container's full pre-scale layout box on mobile —
               and, escaping body's clipping (body isn't positioned), stretch
               the page's scroll extent way past the visible content. */
            top: 0;
            left: 0;
            background: var(--bg-tooltip);
            color: var(--text-on-tooltip);
            padding: 10px;
            border-radius: 5px;
            font-size: 0.85em;
            pointer-events: none;
            z-index: 1000;
            max-width: 300px;
            line-height: 1.4;
        }

        .tooltip .mvmt-link {
            color: var(--text-link); /* color: #1DB954;  Spotify green */
            text-decoration: none;
        }

        .tooltip .mvmt-link:hover {
            text-decoration: underline;
        }

        .dedication {
            font-size: 0.7em;
            color: var(--text-muted);
            font-style: italic;
            margin-left: 2px;
        }

        /* === GUIDE: help button, tour, and anatomy summary ===
           Web only (hidden in print). Everything here sits in fixed overlays
           outside .container, so it never affects the table's layout. Content
           comes from GUIDE_STEPS in the script; swatches reuse the cards' own
           classes, so the legend can't drift from the real colors. */
        :root {
            --guide-dim: rgba(0, 0, 0, 0.62);
            --guide-ring: #FF9800;   /* amber: a hue the cards never use */
            --guide-line: var(--text-lighter);
        }

        /* Link blue: the page's color for anything clickable */
        .guide-button {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top));
            right: calc(10px + env(safe-area-inset-right));
            z-index: 900;
            width: 26px;
            height: 26px;
            padding: 0;
            border-radius: 50%;
            border: 1.5px solid var(--text-link);
            background: var(--bg-card);
            color: var(--text-link);
            font: 700 14px/1 'Helvetica Neue', Arial, sans-serif;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .guide-button:hover,
        .guide-button:focus-visible {
            background: var(--text-link);
            color: var(--bg-card);
        }

        .guide {
            position: fixed;
            inset: 0;
            z-index: 2000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        .guide[hidden] {
            display: none;
        }

        .guide-shade {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .guide-shade .dim {
            fill: var(--guide-dim);
        }

        .guide-shade .ring {
            fill: none;
            stroke: var(--guide-ring);
            stroke-width: 2;
            transition: opacity 0.15s;
        }

        .guide-shade .ring.part {
            stroke-dasharray: 4 3;
            opacity: 0;
        }

        .guide-shade .ring.part.hot {
            opacity: 1;
        }

        .guide-pop {
            position: absolute;
            width: 330px;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            box-sizing: border-box;
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            padding: 16px 18px 12px;
            font-size: 14px;
            line-height: 1.45;
        }

        .guide-pop.docked {
            left: 12px !important;
            right: 12px;
            top: auto !important;
            bottom: calc(12px + env(safe-area-inset-bottom));
            width: auto;
            max-height: 45vh;
        }

        .guide-count {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-lighter);
        }

        .guide h2 {
            margin: 2px 0 6px;
            font-size: 17px;
            color: var(--text-primary);
        }

        .guide p {
            margin: 0 0 8px;
        }

        .guide-close {
            position: absolute;
            top: 8px;
            right: 10px;
            border: none;
            background: none;
            font-size: 20px;
            line-height: 1;
            color: var(--text-lighter);
            cursor: pointer;
        }

        .guide-close:hover {
            color: var(--text-primary);
        }

        .guide-parts {
            margin: 0 0 8px;
            padding: 0;
            list-style: none;
        }

        .guide-parts li {
            padding: 3px 6px;
            margin: 0 -6px;
            border-radius: 4px;
            cursor: default;
        }

        .guide-parts li:hover,
        .guide-parts li.hot {
            background: var(--bg-body);
        }

        .guide-parts b,
        .anatomy-note b {
            color: var(--text-primary);
            font-weight: 600;
        }

        .guide-legend {
            margin: 6px 0 8px;
        }

        .guide-legend h3 {
            margin: 0 0 4px;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-lighter);
            font-weight: 600;
        }

        .guide-legend ul {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 3px;
        }

        .guide-legend li {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Swatches carry the cards' real classes (.card-links.peters,
           .movements-count.mvmt-3, …); these rules only reset their layout. */
        .guide .guide-swatch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 2.6em;
            height: 1.35em;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            border: 1px solid var(--border-card);
            border-radius: 3px;
            box-shadow: none;
            font-size: 12px;
            pointer-events: none;
            transform: none;
            overflow: hidden;
        }

        .guide-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .guide-nav .spacer {
            flex: 1;
        }

        .guide button.nav {
            border: 1px solid var(--border-card);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 5px;
            padding: 5px 12px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .guide button.nav.primary {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-card);
        }

        .guide button.nav.link {
            border: none;
            background: none;
            padding: 5px 4px;
            color: var(--text-link);
        }

        .guide button.nav:disabled {
            visibility: hidden;
        }

        /* Final step: the whole system on one sheet */
        .guide-sheet {
            position: absolute;
            inset: max(16px, 3vh) max(16px, 3vw);
            overflow-y: auto;
            box-sizing: border-box;
            background: var(--bg-body);
            color: var(--text-secondary);
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            padding: 22px 28px 18px;
            font-size: 14px;
            line-height: 1.45;
        }

        .guide-sheet > h2 {
            font-size: 22px;
            text-align: center;
            margin: 0 0 4px;
        }

        .guide-sheet > p {
            text-align: center;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto 18px;
        }

        .anatomy {
            position: relative;
            margin: 0 auto 22px;
        }

        .anatomy-stage {
            position: relative;
            margin: 0 auto;
            font-size: medium;      /* the copied card's em sizes, as on the page */
            line-height: normal;
        }

        .anatomy-inner {
            display: flex;
            width: max-content;     /* measure the copy at its natural size */
            align-items: flex-start;
            gap: var(--card-gap);
            transform-origin: 0 0;
        }

        .anatomy-inner,
        .anatomy-inner * {
            pointer-events: none;
            transition: none !important;
        }

        .anatomy-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .anatomy-lines path {
            fill: none;
            stroke: var(--guide-line);
            stroke-width: 1;
        }

        .anatomy-lines circle {
            fill: var(--text-primary);
        }

        .anatomy-lines .badge circle {
            fill: var(--text-primary);
            stroke: var(--bg-body);
            stroke-width: 1.5;
        }

        .anatomy-lines .badge text {
            fill: var(--bg-body);
            font-size: 10px;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .anatomy-note {
            position: absolute;
            font-size: 12.5px;
            line-height: 1.3;
            color: var(--text-muted);
        }

        .anatomy-note.left,
        .anatomy-note.mid {
            text-align: right;
        }

        .anatomy-note .n {
            display: none;
        }

        /* Narrow sheets: numbered dots on the figure, notes as a list below */
        .anatomy.compact .anatomy-note {
            position: static;
            width: auto;
            text-align: left;
            margin: 0 0 6px;
        }

        .anatomy.compact .anatomy-note .n {
            display: inline-block;
            min-width: 1.5em;
            font-weight: 700;
            color: var(--text-primary);
        }

        .anatomy.compact .anatomy-notes {
            margin-top: 16px;
        }

        .guide-legends {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 36px;
            border-top: 1px solid var(--border-card);
            padding-top: 16px;
        }

        .guide-sheet .guide-nav {
            justify-content: center;
            margin-top: 18px;
        }

        @media (prefers-reduced-motion: reduce) {
            .guide-shade .ring {
                transition: none;
            }
        }

        /* === PRINT STYLES === */
        /*
         * PRINTING INSTRUCTIONS:
         * For best results when printing or saving as PDF:
         * 1. Open print dialog (Cmd+P / Ctrl+P)
         * 2. Enable "Background graphics"
         * 3. Set margins to "Custom" with:
         *    - Top: 0.25 inches
         *    - Bottom: 0 inches (minimum)
         *    - Left: 0 inches (minimum)
         *    - Right: 0 inches (minimum)
         * Note: Browser print dialogs override CSS @page margins,
         * so custom margins must be set manually.
         */
        @media print {
            @page {
                margin: 0;  /* Reset all margins to 0 first */
                margin-top: 0.25in;
                margin-left: 0in;
                margin-right: 0in;
                margin-bottom: 0in;
                size: letter portrait;
            }

            /* Override responsive sizing with fixed desktop values for print */
            :root {
                --card-height: 140px;
                --top-section-height: 20px;
                --nickname-height: 15px;
                --bottom-section-height: 20px;
                --bg-body: white;  /* Print should use white, not #f5f5f5 */
            }

            body {
                font-size: 9pt;
                background: var(--bg-body);
                zoom: 0.73;  /* Scale to 73% to fit on page */
            }

            /* Override responsive font sizes with fixed desktop values for print */
            h1 {
                font-size: 3.5em !important;
                max-width: 100%;  /* Responsive width */
            }

            .subtitle {
                font-size: 1.5em !important;
            }

            /* Page break controls */
            .opus-row {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            /* Clean aesthetics for print */
            .opus-label {
                width: 95px;  /* Fixed width for print (not responsive) */
                box-shadow: none !important;  /* Remove sticky shadow */
                /* position: static;  /* Remove sticky positioning */*/
            }

            .opus-spacer {
                width: 179px;  /* Fixed width for print */
            }

            .quartet-card {
                box-shadow: none !important;
                border: 1px solid #999;
            }

            /* Hide interactive elements */
            .tooltip,
            .guide-button,
            .guide {
                display: none !important;
            }

            /* Hide QR link in print (not useful on paper) - use visibility to preserve grid layout */
            .qr-link {
                visibility: hidden;
            }

            /* Ensure links and recording indicator are visible in print (already using variables) */

            /*
            ChatGPT suggests that if your table has very thin rules (≤0.25pt),
            this reduces Quartz/CUPS line thinning on some printers.
            */

            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        /* Dark mode print: restore dark background when both print and dark mode are active.
           Needed because @media print :root (above) overrides --bg-body to white,
           and it comes after @media (prefers-color-scheme: dark) in source order.
           .dark-mode class already has higher specificity than :root, so it doesn't need this. */
        @media print and (prefers-color-scheme: dark) {
            :root {
                --bg-body: #1a1a1a;
            }
        }

        /* === MOBILE RESPONSIVE (iPhone) === */
        /* Small touch devices */
        /* hover:none = no mouse, pointer:coarse = touch screen */
        @media (hover: none) and (pointer: coarse) and (max-width: 800px) {
            /* Override responsive sizing with fixed desktop values */
            :root {
                --card-height: 140px;
                --card-gap: 10px;
                --opus-label-width: 95px;
                --top-section-height: 20px;
                --nickname-height: 15px;
                --bottom-section-height: 20px;
            }

            /* The card table is far wider than a phone, so scale it down to fit.
               Use transform instead of zoom for Safari compatibility. The
               transform lives on .container (NOT body) so body can clip the
               leftover: a scaled element still reserves its FULL pre-scale box
               for scrolling, and that phantom height is what let the page
               scroll past the content bottom. body{overflow:hidden} clips it,
               and fitMobileHeight() (in the script below) pins body's height to
               the container's on-screen (scaled) height so the page ends
               exactly at the content.
               html gets an EXPLICIT overflow so body's hidden is not propagated
               to the viewport (the CSS default when html is visible) — that
               propagation would leave body unclipped and kill user scrolling
               entirely; with it, the viewport stays scrollable and body itself
               does the clipping. */
            html {
                overflow: auto;
            }
            body {
                margin: 0;
                overflow: hidden;
            }

            .container {
                width: calc(100% / 0.35);  /* Compensate: content laid out at ~286% then scaled down */
                transform: scale(0.35);
                transform-origin: 0 0;
                align-items: center;      /* Keep centered */
            }

            .header-group {
                container-type: normal;
            }

            h1 {
                font-size: 2.7em;
            }

            .opus-spacer {
                /* Width = 2 cards - opus label + 2 gaps (fixed values on mobile) */
                width: calc(2 * var(--card-height) - var(--opus-label-width) + 2 * var(--card-gap));
                margin: 0;  /* Gap handled by container */
            }

            /* Prevent text wrapping in bottom sections */
            .movements-count,
            .opus-label .category-badge {
                white-space: nowrap;
                overflow: hidden;
            }

            .card-links {
                padding: 0px 2px;
            }

            /* The title spans the whole top edge on phones; use the thumb corner */
            .guide-button {
                top: auto;
                bottom: calc(12px + env(safe-area-inset-bottom));
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-group">
            <h1>Luigi Boccherini (1743–1805) – 91 String Quartets</h1>
            <p class="subtitle">see also <a href="https://quartetroulette.com/Boccherini/" target="_blank">Quartet Roulette</a></p>
        </div>
        <div id="visualization"></div>
    </div>

    <script>
        // === GUIDE ENGINE ===
        // The "?" button, the step-by-step tour, and the closing anatomy sheet.
        // Generic machinery only: WHAT it says comes from GUIDE_STEPS (below),
        // and every card it shows is a real one from the table (or a copy of
        // one), so a change to the cards shows up here with no extra work.
        function createGuide(steps, quartets) {
            const SVG_NS = 'http://www.w3.org/2000/svg';
            const SCOPES = { row: '.opus-row', label: '.opus-label', card: '.quartet-card' };
            const resolve = v => typeof v === 'function' ? v(quartets) : v;
            const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // A part only counts if it's actually showing (e.g. repeat signs
            // switched off with --show-ownership: 0 are skipped).
            function visible(el) {
                if (!el) return false;
                const cs = getComputedStyle(el);
                return cs.display !== 'none' && cs.visibility !== 'hidden' && parseFloat(cs.opacity) > 0;
            }
            const partsIn = (step, root) => (step.parts || [])
                .map(p => ({ ...p, el: root.querySelector(p.sel) }))
                .filter(p => visible(p.el));

            // Tight box around an element's text (falls back to the element box)
            function boxOf(el) {
                if (el instanceof SVGElement) return el.getBoundingClientRect();
                const range = document.createRange();
                range.selectNodeContents(el);
                const r = range.getBoundingClientRect();
                return r.width && r.height ? r : el.getBoundingClientRect();
            }

            // Best example for a step: most parts present, then `prefer`, and
            // not one the tour has already shown (so it visits several cards).
            function pick(step, used) {
                let best = null, bestScore = -Infinity;
                document.querySelectorAll(`#visualization ${SCOPES[step.scope]}`).forEach(el => {
                    const d = el.__data__;
                    let score = partsIn(step, el).length * 10;
                    if (step.prefer && d && step.prefer(d)) score += 5;
                    if (used.has(el)) score -= 3;
                    if (score > bestScore) { best = el; bestScore = score; }
                });
                return best;
            }

            const partHTML = p => `<b>${esc(p.label)}</b>${p.text ? ` — ${esc(p.text)}` : ''}`;
            const legendHTML = lg => `<div class="guide-legend"><h3>${esc(lg.title)}</h3><ul>${lg.items.map(it =>
                `<li><span class="guide-swatch ${it.cls}">${it.text != null ? esc(it.text) : ''}</span>${esc(it.label)}</li>`
            ).join('')}</ul></div>`;
            const rectSVG = (r, pad, attrs) =>
                `<rect x="${r.left - pad}" y="${r.top - pad}" width="${r.width + 2 * pad}" height="${r.height + 2 * pad}" rx="5" ${attrs}/>`;

            // --- DOM ---
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'guide-button';
            button.textContent = '?';
            button.title = 'How to read this table';
            button.setAttribute('aria-label', button.title);
            document.body.appendChild(button);

            const root = document.createElement('div');
            root.className = 'guide';
            root.hidden = true;
            root.setAttribute('role', 'dialog');
            root.setAttribute('aria-modal', 'true');
            root.setAttribute('aria-labelledby', 'guide-title');
            root.innerHTML = `
                <svg class="guide-shade" aria-hidden="true">
                    <defs><mask id="guide-mask">
                        <rect width="100%" height="100%" fill="white"/><g class="holes"></g>
                    </mask></defs>
                    <rect class="dim" width="100%" height="100%" mask="url(#guide-mask)"/>
                    <g class="rings"></g>
                </svg>
                <div class="guide-pop"></div>
                <div class="guide-sheet" hidden></div>`;
            document.body.appendChild(root);
            const shade = root.querySelector('.guide-shade');
            const holes = root.querySelector('.holes');
            const rings = root.querySelector('.rings');
            const pop = root.querySelector('.guide-pop');
            const sheet = root.querySelector('.guide-sheet');

            // --- State ---
            let index = -1;        // current step; steps.length = the summary sheet
            let current = null;    // { el, focus, parts, all } for the step on screen
            let hot = -1;          // part highlighted from the popover list
            let used = new Set();
            let returnFocus = null;

            function open(at = 0) {
                returnFocus = document.activeElement;
                used = new Set();
                index = -1;
                root.hidden = false;
                d3.selectAll('.tooltip').style('opacity', 0);
                go(at);
            }

            function close() {
                root.hidden = true;
                index = -1;
                current = null;
                (returnFocus && returnFocus.focus ? returnFocus : button).focus();
            }

            function go(k) {
                const dir = k < index ? -1 : 1;
                // Skip a step whose parts no card shows (e.g. ownership hidden)
                while (k >= 0 && k < steps.length) {
                    const el = pick(steps[k], used);
                    if (el && (!steps[k].parts || partsIn(steps[k], el).length)) break;
                    k += dir;
                }
                index = Math.max(0, Math.min(k, steps.length));
                if (index === steps.length) showSummary(); else showStep(steps[index]);
            }

            // --- Tour step: spotlight a real element, explain it beside it ---
            function showStep(step) {
                sheet.hidden = true;
                shade.style.display = '';
                pop.hidden = false;
                const el = pick(step, used);
                used.add(el);
                current = {
                    el,
                    focus: (step.focus && el.querySelector(step.focus)) || el,
                    parts: partsIn(step, el),
                    all: step.all ? [...document.querySelectorAll(`#visualization ${step.all}`)] : [],
                };
                hot = -1;

                const text = resolve(step.text);
                const legend = resolve(step.legend);
                const last = index === steps.length - 1;
                pop.innerHTML = `
                    <button type="button" class="guide-close" aria-label="Close">×</button>
                    <div class="guide-count">${index + 1} of ${steps.length}</div>
                    <h2 id="guide-title">${esc(step.title)}</h2>
                    ${text ? `<p>${esc(text)}</p>` : ''}
                    ${current.parts.length ? `<ul class="guide-parts">${current.parts.map((p, i) =>
                        `<li data-i="${i}">${partHTML(p)}</li>`).join('')}</ul>` : ''}
                    ${legend ? legendHTML(legend) : ''}
                    <div class="guide-nav">
                        <button type="button" class="nav" data-go="${index - 1}" ${index === 0 ? 'disabled' : ''}>Back</button>
                        <span class="spacer"></span>
                        ${last ? '' : `<button type="button" class="nav link" data-go="${steps.length}">Summary</button>`}
                        <button type="button" class="nav primary" data-go="${index + 1}">${last ? 'Summary' : 'Next'}</button>
                    </div>`;
                pop.scrollTop = 0;
                scrollToTarget(el);
                draw();
                pop.querySelector('.primary').focus({ preventScroll: true });
            }

            const isDocked = () => window.innerWidth < 640;

            function scrollToTarget(el) {
                const r = el.getBoundingClientRect();
                // On phones the popover docks to the bottom, so aim higher.
                const room = isDocked() ? window.innerHeight * 0.5 : window.innerHeight;
                let dx = 0, dy = 0;
                if (r.top < 16 || r.bottom > room - 16) dy = r.top - Math.max(16, (room - r.height) / 2);
                if (r.left < 0 || r.right > window.innerWidth) dx = r.left - Math.max(16, (window.innerWidth - r.width) / 2);
                if (dx || dy) window.scrollBy({ left: dx, top: dy, behavior: reduceMotion ? 'auto' : 'smooth' });
            }

            // Redrawn on every scroll/resize frame: holes in the shade for the
            // example (and any `all` matches on screen), rings, popover position.
            function draw() {
                if (!current) return;
                const vw = window.innerWidth, vh = window.innerHeight;
                const onScreen = r => r.bottom > -40 && r.top < vh + 40 && r.right > -40 && r.left < vw + 40;
                holes.innerHTML = [current.el, ...current.all]
                    .map((e, i) => [e.getBoundingClientRect(), i])
                    .filter(([r]) => onScreen(r))
                    .map(([r, i]) => rectSVG(r, i ? 0 : 6, 'fill="black"')).join('');
                rings.innerHTML = rectSVG(current.focus.getBoundingClientRect(), 6, 'class="ring"') +
                    current.parts.map((p, i) =>
                        rectSVG(boxOf(p.el), 3, `class="ring part${i === hot ? ' hot' : ''}" data-i="${i}"`)).join('');
                placePop();
            }

            function placePop() {
                const docked = isDocked();
                pop.classList.toggle('docked', docked);
                if (docked) return;
                const vw = window.innerWidth, vh = window.innerHeight, m = 12, gap = 18;
                const r = current.el.getBoundingClientRect();
                const w = pop.offsetWidth, h = pop.offsetHeight;
                const clampX = x => Math.max(m, Math.min(vw - w - m, x));
                const clampY = y => Math.max(m, Math.min(vh - h - m, y));
                let x, y;
                if (r.right + gap + w + m <= vw) {
                    x = r.right + gap; y = clampY(r.top + r.height / 2 - h / 2);
                } else if (r.left - gap - w >= m) {
                    x = r.left - gap - w; y = clampY(r.top + r.height / 2 - h / 2);
                } else if (r.bottom + gap + h + m <= vh) {
                    x = clampX(r.left + r.width / 2 - w / 2); y = r.bottom + gap;
                } else {
                    x = clampX(r.left + r.width / 2 - w / 2); y = clampY(r.top - gap - h);
                }
                pop.style.left = `${x}px`;
                pop.style.top = `${y}px`;
            }

            function setHot(i) {
                hot = i;
                pop.querySelectorAll('.guide-parts li').forEach(li => li.classList.toggle('hot', +li.dataset.i === i));
                rings.querySelectorAll('.ring.part').forEach(r => r.classList.toggle('hot', +r.dataset.i === i));
            }

            // --- Summary: every part at once on a copy of the most complete card ---
            function showSummary() {
                current = null;
                pop.hidden = true;
                shade.style.display = 'none';
                sheet.hidden = false;

                const labelSteps = steps.filter(s => s.scope === 'label');
                const cardSteps = steps.filter(s => s.scope === 'card');
                const labelOf = card => card.parentNode.previousElementSibling;
                const score = (ss, el) => ss.reduce((n, s) =>
                    n + partsIn(s, el).length * 10 + (s.parts && s.prefer && s.prefer(el.__data__) ? 1 : 0), 0);
                let card = null, best = -1;
                document.querySelectorAll('#visualization .quartet-card').forEach(c => {
                    const n = score(cardSteps, c) + score(labelSteps, labelOf(c));
                    if (n > best) { best = n; card = c; }
                });

                const lede = resolve(steps[0].text);
                sheet.innerHTML = `
                    <button type="button" class="guide-close" aria-label="Close">×</button>
                    <h2 id="guide-title">How to read the table</h2>
                    ${lede ? `<p>${esc(lede)}</p>` : ''}
                    <div class="anatomy"><div class="anatomy-stage"><div class="anatomy-inner"></div></div></div>
                    <div class="guide-legends">${steps.filter(s => s.legend)
                        .map(s => legendHTML(resolve(s.legend))).join('')}</div>
                    <div class="guide-nav">
                        <button type="button" class="nav" data-go="${steps.length - 1}">Back</button>
                        <button type="button" class="nav" data-go="0">Replay tour</button>
                        <button type="button" class="nav primary" data-close>Done</button>
                    </div>`;
                const labelCopy = labelOf(card).cloneNode(true);
                const cardCopy = card.cloneNode(true);
                cardCopy.removeAttribute('style');  // drop any hover/active border
                sheet.querySelector('.anatomy-inner').append(labelCopy, cardCopy);
                layoutAnatomy();
                sheet.scrollTop = 0;
                sheet.querySelector('.primary').focus({ preventScroll: true });
            }

            // Notes with leader lines, in columns: label parts on the far left;
            // card parts on the right, or — when there's room — those on the
            // card's left half in a middle column, so no line crosses the card.
            // Too narrow for columns: numbered dots, notes listed below.
            function layoutAnatomy() {
                const fig = sheet.querySelector('.anatomy');
                const stage = fig.querySelector('.anatomy-stage');
                const inner = fig.querySelector('.anatomy-inner');
                const [labelCopy, cardCopy] = inner.children;
                fig.querySelectorAll('.anatomy-lines, .anatomy-notes').forEach(n => n.remove());
                fig.style.height = inner.style.gap = inner.style.transform = '';
                stage.style.width = stage.style.height = '';

                const GUT = 28, MAX = 2.2, MIN = 1.3;
                const w0 = labelCopy.offsetWidth + cardCopy.offsetWidth;
                const nh = inner.offsetHeight;
                const avail = fig.clientWidth;
                const fit = (cols, col, extra) => Math.min(MAX, 330 / nh, (avail - cols * col - (cols + 1) * GUT) / (w0 + extra));
                let mode = 'compact', COL = 0, scale = Math.min(1.6, avail / inner.offsetWidth);
                for (const [m, cols, col] of [['three', 3, 190], ['three', 3, 150], ['two', 2, 190]]) {
                    const s = fit(cols, col, m === 'two' ? inner.offsetWidth - w0 : 0);
                    if (s >= MIN) { mode = m; COL = col; scale = s; break; }
                }
                fig.classList.toggle('compact', mode === 'compact');
                if (mode === 'three') inner.style.gap = `${(COL + 2 * GUT) / scale}px`;
                inner.style.transform = `scale(${scale})`;
                stage.style.width = `${inner.offsetWidth * scale}px`;
                stage.style.height = `${nh * scale}px`;

                const fr = fig.getBoundingClientRect();
                const rel = r => ({ l: r.left - fr.left, r: r.right - fr.left, t: r.top - fr.top, b: r.bottom - fr.top,
                                    cx: (r.left + r.right) / 2 - fr.left, cy: (r.top + r.bottom) / 2 - fr.top });
                const sr = rel(stage.getBoundingClientRect());
                const lr = rel(labelCopy.getBoundingClientRect());
                const cr = rel(cardCopy.getBoundingClientRect());
                // Where each column's notes sit, where their lines bend, and
                // which edge of the target the line ends on.
                const COLS = {
                    left:  { x: sr.l - GUT - COL, x0: sr.l - GUT + 4, x1: sr.l - 10, edge: 'l' },
                    mid:   { x: lr.r + GUT, x0: lr.r + GUT + COL + 4, x1: cr.l - 10, edge: 'l' },
                    right: { x: sr.r + GUT, x0: sr.r + GUT - 4, x1: sr.r + 10, edge: 'r' },
                };

                const notesBox = document.createElement('div');
                notesBox.className = 'anatomy-notes';
                const notes = [];
                [[labelCopy, 'label'], [cardCopy, 'card']].forEach(([copy, scope]) =>
                    steps.filter(s => s.scope === scope).forEach(s => partsIn(s, copy).forEach(part => {
                        const p = rel(boxOf(part.el));
                        const side = scope === 'label' ? 'left'
                            : mode === 'three' && p.cx < cr.l + (cr.r - cr.l) * 0.4 ? 'mid' : 'right';
                        const div = document.createElement('div');
                        div.className = `anatomy-note ${side}`;
                        div.innerHTML = `<span class="n">${notes.length + 1}</span>${partHTML(part)}`;
                        notesBox.append(div);
                        notes.push({ side, div, p, n: notes.length + 1 });
                    })));
                fig.append(notesBox);

                let svg = '';
                if (mode === 'compact') {
                    const placed = [];
                    notes.forEach(({ side, p, n }) => {
                        let x = side === 'left' ? p.l - 8 : p.r + 8;
                        while (placed.some(([px, py]) => Math.hypot(px - x, py - p.cy) < 16)) x += side === 'left' ? 16 : -16;
                        placed.push([x, p.cy]);
                        svg += `<g class="badge"><circle cx="${x}" cy="${p.cy}" r="7.5"/><text x="${x}" y="${p.cy}">${n}</text></g>`;
                    });
                } else {
                    let bottom = sr.b;
                    Object.entries(COLS).forEach(([side, c]) => {
                        const col = notes.filter(o => o.side === side).sort((a, b) => a.p.cy - b.p.cy);
                        if (!col.length) return;
                        col.forEach(o => {
                            o.div.style.left = `${c.x}px`;
                            o.div.style.width = `${COL}px`;
                            o.h = o.div.offsetHeight;
                        });
                        // Stack notes beside their targets without overlapping,
                        // then lift the column if it runs past the figure.
                        let cursor = sr.t;
                        col.forEach(o => { o.top = Math.max(cursor, o.p.cy - 8); cursor = o.top + o.h + 8; });
                        const lift = Math.min(cursor - 8 - sr.b, col[0].top - sr.t);
                        col.forEach(o => {
                            if (lift > 0) o.top -= lift;
                            o.div.style.top = `${o.top}px`;
                            bottom = Math.max(bottom, o.top + o.h);
                            const tx = c.edge === 'l' ? o.p.l - 2 : o.p.r + 2;
                            svg += `<path d="M${c.x0},${o.top + 8} H${c.x1} L${tx},${o.p.cy}"/>` +
                                   `<circle cx="${tx}" cy="${o.p.cy}" r="2.5"/>`;
                        });
                    });
                    fig.style.height = `${bottom}px`;
                }
                const lines = document.createElementNS(SVG_NS, 'svg');
                lines.setAttribute('class', 'anatomy-lines');
                lines.innerHTML = svg;
                fig.append(lines);
            }

            // --- Events ---
            button.addEventListener('click', () => open());
            root.addEventListener('click', e => {
                const b = e.target.closest('button');
                if (!b) return;
                if (b.classList.contains('guide-close') || b.hasAttribute('data-close')) close();
                else if (b.dataset.go != null) {
                    if (+b.dataset.go === 0) used = new Set();
                    go(+b.dataset.go);
                }
            });
            pop.addEventListener('pointerover', e => {
                const li = e.target.closest('.guide-parts li');
                setHot(li ? +li.dataset.i : -1);
            });
            pop.addEventListener('pointerleave', () => setHot(-1));

            let frame = 0;
            const redraw = () => {
                cancelAnimationFrame(frame);
                frame = requestAnimationFrame(() => {
                    if (root.hidden) return;
                    if (index === steps.length) layoutAnatomy(); else draw();
                });
            };
            window.addEventListener('scroll', () => { if (current) redraw(); }, { passive: true });
            window.addEventListener('resize', redraw);

            document.addEventListener('keydown', e => {
                if (root.hidden) {
                    if (e.key === '?' && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); open(); }
                    return;
                }
                if (e.key === 'Escape') close();
                else if (e.key === 'ArrowRight' && index < steps.length) go(index + 1);
                else if (e.key === 'ArrowLeft' && index > 0) go(index - 1);
                else return;
                e.preventDefault();
            });
        }
    </script>
    <script>
        // On phones the card table is scaled down (see the mobile @media rule). A
        // CSS-transformed element still reserves its full PRE-scale size for
        // scrolling, so without this the page scrolls well past the visible
        // content. Pin <body>'s height to the container's actual on-screen
        // (scaled) height; body{overflow:hidden} then clips the phantom box.
        // No-op on desktop, where nothing is scaled (height cleared to auto).
        const MOBILE_MQ = window.matchMedia('(hover: none) and (pointer: coarse) and (max-width: 800px)');
        function fitMobileHeight() {
            const c = document.querySelector('.container');
            if (!c) return;
            document.body.style.height = MOBILE_MQ.matches
                ? Math.ceil(c.getBoundingClientRect().height) + 'px'
                : '';
        }
        window.addEventListener('resize', fitMobileHeight);
        window.addEventListener('orientationchange', () => setTimeout(fitMobileHeight, 200));

        // === WHAT THE CARDS SHOW (single source for rendering AND the guide) ===
        // Each table below is used by renderQuartetCard/renderOpusLabel to pick
        // a class, and by the guide (GUIDE_STEPS) to explain it. Change a rule
        // or a label here and both update; colors live only in the CSS classes.

        // Links strip background: the FIRST matching state wins, so order matters.
        const imslpOf = (quartet, opus) => quartet.imslp || opus.imslp;
        const LINK_STATES = [
            { cls: 'peters',   label: 'In the Peters edition',     test: (q) => q.edition === 'Peters' },
            { cls: 'no-data',  label: 'No score or recording yet', test: (q, o) => !imslpOf(q, o) && !q.hasRecording },
            { cls: 'no-imslp', label: 'No score on IMSLP',         test: (q, o) => !imslpOf(q, o) },
            { cls: 'no-music', label: 'No recording',              test: (q) => !q.hasRecording },
            { cls: '',         label: 'Score and recording',       test: () => true },
        ];
        const linkState = (quartet, opus) => LINK_STATES.find(s => s.test(quartet, opus));

        // Opus category badge (and the row header's tint)
        const categoryOf = category => category.includes('grande')
            ? { cls: 'grande', name: 'Grande', label: 'Opera grande: full-length, mostly 3–4 movements' }
            : { cls: 'piccola', name: 'Piccola', label: 'Opera piccola: short, mostly 2 movements' };

        const hasMinuet = quartet => quartet.mvmts.some(m => m.includes('Minuetto'));

        // === GUIDE CONTENT ===
        // The tour shows one step at a time on a real card; the closing summary
        // shows every step's parts at once on a copy of the most complete card,
        // with each step's legend. Edit here when the card changes.
        //   scope:  which element the step is about ('row', 'label' or 'card')
        //   focus:  region of that element to ring (default: the whole element)
        //   prefer: predicate on the element's data, to pick a good example
        //   all:    selector lit up across the whole table, to show the pattern
        //   parts:  [{sel, label, text}] — sel is relative to the scope element;
        //           a part the example doesn't have is simply left out
        //   legend: {title, items: [{cls, text?, label}]}, or (quartets) => that;
        //           cls is the real class list a swatch is drawn with
        const GUIDE_STEPS = [
            {
                title: 'The table',
                scope: 'row',
                text: quartets => `Every square is one of Boccherini’s ${quartets.length} string quartets, ` +
                    `and every row is an opus, in order of composition (${d3.min(quartets, q => q.year)}–` +
                    `${d3.max(quartets, q => q.year)}). Short opuses share a row. ` +
                    `Hover over a quartet (or tap it) to see its full title and movements.`,
            },
            {
                title: 'Each opus',
                scope: 'label',
                prefer: ({ opus }) => opus.dedication && opus.imslp,
                parts: [
                    { sel: '.year', label: 'Year', text: 'when the opus was composed' },
                    { sel: '.age', label: 'Age', text: 'Boccherini’s age that year' },
                    { sel: '.dedication', label: 'Dedication', text: 'to whom the opus is dedicated' },
                    { sel: '.opus-number', label: 'Opus number', text: '' },
                    { sel: '.imslp-link', label: 'imslp', text: 'score for the whole opus' },
                    { sel: '.category-badge', label: 'Grande / Piccola', text: 'the kind of quartet (the row is tinted to match)' },
                ],
                legend: quartets => ({
                    title: 'Opus type',
                    items: [...new Set(quartets.map(q => q.category))].sort().map(c => categoryOf(c))
                        .map(c => ({ cls: `category-badge ${c.cls}`, label: c.label })),
                }),
            },
            {
                title: 'Top bar',
                scope: 'card',
                focus: '.mode-bar',
                prefer: ({ quartet }) => !quartet.major,
                all: '.mode-bar.minor',
                parts: [
                    { sel: '.gerard-number', label: 'Gérard number', text: 'from Yves Gérard’s catalogue (G.159–249)' },
                    { sel: '.quartet-number', label: '#', text: 'position within the opus' },
                    { sel: '.mode-bar.minor', label: 'Pink bar', text: 'minor key (every one is lit up)' },
                ],
                legend: {
                    title: 'Mode',
                    items: [
                        { cls: 'mode-bar major', label: 'Major key' },
                        { cls: 'mode-bar minor', label: 'Minor key' },
                    ],
                },
            },
            {
                title: 'Key',
                scope: 'card',
                prefer: ({ quartet }) => quartet.key_signature && quartet.key_signature.count >= 3,
                parts: [
                    { sel: '.key-section', label: 'Key', text: 'tonic and mode' },
                    { sel: '.key-accidentals', label: 'Key signature', text: 'its sharps or flats' },
                ],
            },
            {
                title: 'Peters edition',
                scope: 'card',
                focus: '.nickname',
                prefer: ({ quartet }) => quartet.nickname && quartet.nickname.startsWith('Peters '),
                all: '.nickname',
                parts: [
                    { sel: '.nickname', label: 'Peters label', text: 'its number in the Peters edition, and the opus number Peters printed on it. “Peters: see …” means Peters printed this quartet’s number on a different one.' },
                ],
            },
            {
                title: 'Links',
                scope: 'card',
                focus: '.card-links',
                prefer: ({ quartet, opus }) => linkState(quartet, opus).cls === 'no-music',
                all: '.card-links',
                parts: [
                    { sel: '.card-links .imslp-link', label: 'imslp', text: 'score on IMSLP' },
                    { sel: '.qr-link', label: 'QR', text: 'this quartet on Quartet Roulette' },
                    { sel: '.recording-indicator', label: '♩', text: 'a recording on Spotify' },
